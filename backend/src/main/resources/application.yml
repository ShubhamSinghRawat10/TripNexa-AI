spring:
  application:
    name: smarttrip-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarttrip}
    username: ${DB_USERNAME:smarttrip}
    password: ${DB_PASSWORD:smarttrip}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Development-only fallback. Always provide JWT_SECRET in deployed environments.
    secret: ${JWT_SECRET:c21hcnR0cmlwLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWtleS0yMDI2IQ==}
    expiration: ${JWT_EXPIRATION:PT2H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  weather:
    api-key: ${OPENWEATHER_API_KEY:}
    base-url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
