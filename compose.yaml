services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smarttrip
      POSTGRES_USER: smarttrip
      POSTGRES_PASSWORD: smarttrip
    ports:
      - "5432:5432"
    volumes:
      - smarttrip-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrip -d smarttrip"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smarttrip-postgres:
